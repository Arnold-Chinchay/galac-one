name: build-index

# Spatial index of SPHEREx images (pipeline/s3index.py), published as the release index-<release>.
# Incremental: only new weeks and the 2 newest existing ones are indexed. Runs every Monday for qr3.

on:
  schedule:
    - cron: "0 12 * * 1"          # Mondays 12:00 UTC (07:00 Peru) -> release qr3
  workflow_dispatch:
    inputs:
      release:
        description: "Data release prefix in the bucket (dr1, qr3)"
        default: "qr3"
      weeks_per_job:
        description: "Weeks per parallel job"
        default: "5"

permissions:
  contents: write

env:
  REL: ${{ inputs.release || 'qr3' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      has_work: ${{ steps.m.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install boto3 astropy --quiet
      - name: Download previous index (if any)
        run: |
          mkdir -p prev
          gh release download "index-$REL" -p "${REL}_index.csv.gz" -D prev 2>/dev/null || echo "no previous index"
          ls -la prev
      - id: m
        env:
          N: ${{ inputs.weeks_per_job || '5' }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, glob, gzip, json, os
          from pipeline.s3index import list_weeks
          rel, n = os.environ["REL"], int(os.environ["N"])
          present = set()
          for f in glob.glob("prev/*.csv.gz"):
              with gzip.open(f, "rt", newline="") as fh:
                  r = csv.reader(fh); h = next(r); ki = h.index("key")
                  present |= {row[ki].split("/")[2] for row in r}
          allw = list_weeks(rel)
          redo = set(sorted(present)[-2:])           # newest weeks may have been partial
          todo = [w for w in allw if w not in present or w in redo]
          chunks = [" ".join(todo[i:i + n]) for i in range(0, len(todo), n)]
          print("has_work=" + ("true" if chunks else "false"))
          print("matrix=" + json.dumps({"weeks": chunks or [""]}))
          import sys; print(f"{rel}: {len(allw)} weeks in bucket, {len(present)} already indexed, {len(todo)} to do", file=sys.stderr)
          EOF

  index:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install boto3 astropy --quiet
      - name: Remove stale per-week files so redone weeks are rebuilt
        run: rm -rf cache/index
      - run: python -m pipeline.s3index --release $REL --weeks ${{ matrix.weeks }} --workers 64
      - id: name
        run: echo "n=$(echo '${{ matrix.weeks }}' | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: index-${{ inputs.release || 'qr3' }}-${{ steps.name.outputs.n }}
          path: cache/index/${{ inputs.release || 'qr3' }}/*.csv.gz
          retention-days: 7

  merge:
    needs: [plan, index]
    if: always() && needs.plan.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download previous index (if any)
        run: |
          mkdir -p prev
          gh release download "index-$REL" -p "${REL}_index.csv.gz" -D prev 2>/dev/null || echo "no previous index"
      - uses: actions/download-artifact@v4
        with:
          pattern: index-${{ inputs.release || 'qr3' }}-*
          path: parts
          merge-multiple: true
      - name: Merge previous index with new weeks
        run: |
          python - <<'EOF'
          import csv, glob, gzip, os
          rel = os.environ["REL"]
          new_files = sorted(glob.glob("parts/*.csv.gz"))
          new_weeks = set()
          rows_new, header = [], None
          for f in new_files:
              with gzip.open(f, "rt", newline="") as fh:
                  r = csv.reader(fh); header = next(r)
                  for row in r:
                      rows_new.append(row); new_weeks.add(row[0].split("/")[2])
          kept = 0
          with gzip.open(f"{rel}_index.csv.gz", "wt", newline="") as out:
              w = csv.writer(out)
              w.writerow(header)
              for f in glob.glob("prev/*.csv.gz"):
                  with gzip.open(f, "rt", newline="") as fh:
                      r = csv.reader(fh); next(r)
                      for row in r:
                          if row[0].split("/")[2] not in new_weeks:
                              w.writerow(row); kept += 1
              w.writerows(rows_new)
          total = kept + len(rows_new)
          msg = f"{total} images ({kept} kept, {len(rows_new)} new from {len(new_weeks)} weeks)"
          print(msg); open("summary.txt", "w").write(msg + "\n")
          EOF
      - name: Publish as release asset
        run: |
          TAG="index-$REL"
          NOTES="Built from FITS headers in s3://nasa-irsa-spherex/$REL/level2 by pipeline/s3index.py. $(cat summary.txt). Updated $(date -u +%F)."
          gh release view "$TAG" >/dev/null 2>&1 && gh release edit "$TAG" --notes "$NOTES" || gh release create "$TAG" --title "SPHEREx $REL spatial index" --notes "$NOTES"
          gh release upload "$TAG" "${REL}_index.csv.gz" --clobber
