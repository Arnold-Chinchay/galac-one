<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALAC ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --night:#05070C; --sepia:#CDAE82; --blue:#82AAD6; --star:#F4E7D1; }
  html,body{height:100%;margin:0}
  body{
    position:relative;
    overflow:hidden;
    background:var(--night) url("planeta.jpg") center 30% / cover no-repeat;
  }
  body::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(to right,
      rgba(5,7,12,0) 50%, rgba(5,7,12,.45) 75%, rgba(5,7,12,.6) 100%);
    pointer-events:none;
  }

  /* Lienzo 3D colocado sobre el planeta de la foto */
  #planet{ position:absolute; pointer-events:none; }
  #planet canvas{ display:block; width:100%; height:100%; }

  .logo{
    position:absolute; right:8vw; top:46%;
    transform:translateY(-50%);
    width:min(38vw,640px);
  }
  .logo svg{width:100%;height:auto;display:block}
  .tag{font-family:'Jost','Futura','Century Gothic',sans-serif;font-weight:500}

  @media (max-aspect-ratio: 1/1){
    .logo{ right:auto; left:50%; top:auto; bottom:8vh; transform:translateX(-50%); width:86vw; }
  }
</style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>

<div id="planet"></div>

<div class="logo">
<svg viewBox="0 0 740 165" role="img" aria-label="GALAC ONE — EXPLORE, OBSERVE, DISCOVER">
  <g transform="translate(4 8) scale(1.45)">
    <g fill="#CDAE82" stroke="#CDAE82">
      <path d="M50.89 15.37 A25.5 25.5 0 1 0 55.5 30" fill="none" stroke-width="9"/>
      <path d="M60 30 H32" fill="none" stroke-width="9"/>
      <polygon stroke="none" transform="translate(74 0)"
        points="0,60 20,0 28,0 48,60 38.51,60 24,16.47 9.49,60"/>
      <polygon stroke="none" transform="translate(136 0)"
        points="0,0 9,0 9,51 34,51 34,60 0,60"/>
      <polygon stroke="none" transform="translate(184 0)"
        points="0,60 20,0 28,0 48,60 38.51,60 24,16.47 9.49,60"/>
      <path transform="translate(246 0)" d="M49.53 13.61 A25.5 25.5 0 1 0 49.53 46.39"
        fill="none" stroke-width="9"/>
    </g>
    <circle cx="98"  cy="47" r="4.6" fill="#F4E7D1"/>
    <circle cx="208" cy="47" r="4.6" fill="#F4E7D1"/>
    <g fill="#82AAD6" stroke="#82AAD6">
      <path transform="translate(332 0)" d="M53.11 19.22 A25.5 25.5 0 1 1 40.78 6.89"
        fill="none" stroke-width="9"/>
      <polygon stroke="none" transform="translate(406 0)"
        points="0,60 0,0 10,0 39,44.5 39,0 48,0 48,60 38,60 9,15.5 9,60"/>
      <g stroke="none" transform="translate(468 0)">
        <rect x="0" y="0"    width="9"  height="60"/>
        <rect x="0" y="0"    width="36" height="9"/>
        <rect x="0" y="25.5" width="29" height="9"/>
        <rect x="0" y="51"   width="36" height="9"/>
      </g>
    </g>
    <circle cx="380.03" cy="11.97" r="3.6" fill="#F4E7D1"/>
  </g>
  <line id="lineL" y1="141" y2="141" stroke="#CDAE82" stroke-width="1.5"/>
  <text id="tagText" class="tag" x="369.5" y="149" text-anchor="middle"
        font-size="22" letter-spacing="7" fill="#F4E7D1">ESPLORE<tspan fill="#82AAD6"> • </tspan>OBSERVE<tspan fill="#82AAD6"> • </tspan>DISCOVER</text>
  <line id="lineR" y1="141" y2="141" stroke="#82AAD6" stroke-width="1.5"/>
</svg>
</div>

<script>
/* ---------- Lema ---------- */
function placeTagline() {
  const box = document.getElementById('tagText').getBBox();
  const left = 4, right = 4 + 504 * 1.45, gap = 18;
  const L = document.getElementById('lineL'), R = document.getElementById('lineR');
  L.setAttribute('x1', left);  L.setAttribute('x2', (box.x - gap).toFixed(1));
  R.setAttribute('x1', (box.x + box.width + gap).toFixed(1)); R.setAttribute('x2', right);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(placeTagline);
</script>

<script type="module">
import * as THREE from 'three';

/* ====== AJUSTES ====== */
const IMG_W = 1900, IMG_H = 1124;   // tamaño real de planeta.jpg
const PX = 776, PY = 462, PR = 352; // centro y radio del planeta en la foto
const VUELTA = 20;                  // segundos por vuelta de la superficie
const VUELTA_NUBES = 25;            // las nubes giran un poco más rápido
const INCLINACION = -0.25;          // inclinación del eje (radianes)
const LUZ = new THREE.Vector3(1, 0.4, -0.6).normalize(); // sol: derecha, abajo, detrás
const FIT = 0.8;                    // el planeta ocupa el 80% del lienzo (resto = halo)

/* ====== Escena ====== */
const box = document.getElementById('planet');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
box.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1/FIT, 1/FIT, 1/FIT, -1/FIT, 0.1, 10);
camera.position.z = 5;

const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.copy(LUZ);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x223355, 0.12));

const eje = new THREE.Group();
eje.rotation.z = INCLINACION;
scene.add(eje);

/* ====== Utilidades de textura ====== */
function rnd(seed){ return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function blob(ctx, x, y, rx, ry, rgb, a){
  ctx.save(); ctx.translate(x, y); ctx.scale(rx / ry, 1);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, ry, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function toTexture(c){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* Superficie: bandas tipo Neptuno, continuas en longitud (sin costuras) */
function makeSurface(){
  const W = 1024, H = 512, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d'), img = ctx.createImageData(W, H), d = img.data;
  const dark = [8, 24, 62], light = [74, 128, 205];
  for (let y = 0; y < H; y++){
    const lat = y / H, pole = Math.sin(lat * Math.PI);
    for (let x = 0; x < W; x++){
      const lon = x / W * Math.PI * 2;
      const v = lat * 16
        + 0.50 * Math.sin(2 * lon + 9 * lat)
        + 0.25 * Math.sin(5 * lon + 1.3 + 21 * lat)
        + 0.12 * Math.sin(11 * lon + 2.1 + 40 * lat);
      let b = 0.5 + 0.5 * Math.sin(v);
      b = b * 0.75 + 0.25 * (0.5 + 0.5 * Math.sin(lat * 60 + 0.4 * Math.sin(3 * lon)));
      b *= 0.55 + 0.45 * pole;
      b += 0.04 * Math.sin(lon * 23 + lat * 90) * Math.sin(lat * 140);
      b = Math.min(1, Math.max(0, b));
      const i = (y * W + x) * 4;
      d[i]   = dark[0] + (light[0] - dark[0]) * b;
      d[i+1] = dark[1] + (light[1] - dark[1]) * b;
      d[i+2] = dark[2] + (light[2] - dark[2]) * b;
      d[i+3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  blob(ctx, 0.62 * W, 0.64 * H, 46, 20, '4,12,35', 0.85);   // gran mancha oscura
  blob(ctx, 0.62 * W, 0.60 * H, 40, 5, '200,215,255', 0.5); // nube junto a la mancha
  return toTexture(c);
}

/* Nubes: capa transparente con cirros blancos */
function makeClouds(){
  const W = 1024, H = 512, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d'), r = rnd(42);
  for (let k = 0; k < 16; k++){
    const cx = 90 + r() * (W - 180), cy = 50 + r() * (H - 100);
    const n = 3 + Math.floor(r() * 4);
    for (let j = 0; j < n; j++){
      blob(ctx, cx + (r() - 0.5) * 50, cy + (r() - 0.5) * 10,
           12 + r() * 30, 3 + r() * 5, '235,240,255', 0.45 + r() * 0.45);
    }
  }
  return toTexture(c);
}

/* ====== Planeta y nubes ====== */
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(1, 128, 128),
  new THREE.MeshStandardMaterial({ map: makeSurface(), roughness: 1, metalness: 0 })
);
eje.add(planet);

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.006, 128, 128),
  new THREE.MeshStandardMaterial({ map: makeClouds(), transparent: true, depthWrite: false, roughness: 1 })
);
eje.add(clouds);

/* ====== Atmósfera ====== */
const vert = `
  varying vec3 vN;
  void main(){
    vN = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }`;
const uniforms = { uLight: { value: LUZ }, uColor: { value: new THREE.Color(0.45, 0.66, 1.0) } };

// Mezcla aditiva que también suma la opacidad: donde no hay brillo, queda transparente
const glowBlend = {
  transparent: true,
  depthWrite: false,
  blending: THREE.CustomBlending,
  blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor,      blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor
};

// Brillo en el borde del disco (lado iluminado)
const rim = new THREE.Mesh(
  new THREE.SphereGeometry(1.01, 96, 96),
  new THREE.ShaderMaterial({
    ...glowBlend, uniforms, vertexShader: vert,
    fragmentShader: `
      uniform vec3 uLight; uniform vec3 uColor; varying vec3 vN;
      void main(){
        float f = pow(1.0 - max(vN.z, 0.0), 2.5);
        float l = clamp(dot(vN, uLight) + 0.25, 0.0, 1.0);
        vec3 c = uColor * f * l * 1.6;
        gl_FragColor = vec4(c, max(c.r, max(c.g, c.b)));
      }`
  })
);
scene.add(rim);

// Halo exterior que se desvanece en el espacio
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 96, 96),
  new THREE.ShaderMaterial({
    ...glowBlend, uniforms, vertexShader: vert, side: THREE.BackSide,
    fragmentShader: `
      uniform vec3 uLight; uniform vec3 uColor; varying vec3 vN;
      void main(){
        float f = pow(clamp(-vN.z * 2.0, 0.0, 1.0), 3.0);
        float l = clamp(dot(vN, uLight) + 0.2, 0.0, 1.0);
        vec3 c = uColor * f * l * 0.9;
        gl_FragColor = vec4(c, max(c.r, max(c.g, c.b)));
      }`
  })
);
scene.add(halo);

/* ====== Colocar el lienzo sobre el planeta de la foto ====== */
function place(){
  const W = innerWidth, H = innerHeight;
  const s  = Math.max(W / IMG_W, H / IMG_H);
  const ox = (W - IMG_W * s) * 0.5, oy = (H - IMG_H * s) * 0.3;
  const r  = PR * s + 2;              // +2px para tapar el borde original
  const size = 2 * r / FIT;
  box.style.width = box.style.height = size + 'px';
  box.style.left = (ox + PX * s - size / 2) + 'px';
  box.style.top  = (oy + PY * s - size / 2) + 'px';
  renderer.setSize(size, size, false);
}
addEventListener('resize', place);
place();

/* ====== Animación ====== */
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (!quieto){
    planet.rotation.y += dt * Math.PI * 2 / VUELTA;
    clouds.rotation.y += dt * Math.PI * 2 / VUELTA_NUBES;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
